<svg width="100%" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #000000; }
      .wave { fill: #0a0a0a; }
      .stroke-title {
        font-family: 'Arial Black', Impact, sans-serif;
        font-size: 75px;
        font-weight: 900;
        fill: transparent;
        stroke: #ffffff;
        stroke-width: 2.5px;
        letter-spacing: 10px;
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation: drawStroke 4s ease-in-out infinite alternate;
      }
      .sub-title {
        font-family: 'Courier New', monospace;
        font-size: 16px;
        fill: #ffffff;
        letter-spacing: 6px;
        opacity: 0.8;
      }
      @keyframes drawStroke {
        0% { stroke-dashoffset: 400; fill: transparent; }
        70% { stroke-dashoffset: 0; fill: transparent; filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8)); }
        100% { stroke-dashoffset: 0; fill: rgba(255, 255, 255, 0.15); filter: drop-shadow(0 0 12px rgba(255, 255, 255, 1)); }
      }
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg" rx="10"/>
  <path class="wave" d="M 0 140 Q 200 180 400 140 T 800 140 L 800 220 L 0 220 Z" />
  <text x="50%" y="115" text-anchor="middle" class="stroke-title">KILLAZIK</text>
  <text x="50%" y="165" text-anchor="middle" class="sub-title">> BACKEND DEVELOPER</text>
</svg>
